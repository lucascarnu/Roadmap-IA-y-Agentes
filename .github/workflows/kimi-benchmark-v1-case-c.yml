name: 'Kimi Benchmark v1 - Case C - Canonical Frozen Input'

on:
  workflow_dispatch:
    inputs:
      confirm_canonical_run:
        description: 'Ejecuta una única corrida CANONICAL_FROZEN_INPUT del Caso C'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: 'kimi-benchmark-v1-case-c-canonical'
  cancel-in-progress: false

jobs:
  benchmark:
    if: >-
      github.repository == 'lucascarnu/Roadmap-IA-y-Agentes' &&
      github.ref == 'refs/heads/codex/instalar-review-gemini' &&
      inputs.confirm_canonical_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Checkout exact runner revision'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          persist-credentials: false

      - name: 'Run Kimi on canonical frozen Case C'
        env:
          KIMI_API_KEY: '${{ secrets.KIMI_API_KEY }}'
          BENCHMARK_OUTPUT_PATH: '${{ runner.temp }}/kimi-open-platform-run-2.json'
        run: node laboratorio/benchmarks/reviewers/v1/runners/kimi-open-platform-case-c.js

      - name: 'Preserve raw benchmark result'
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 'kimi-open-platform-run-2'
          path: '${{ runner.temp }}/kimi-open-platform-run-2.json'
          if-no-files-found: error
          retention-days: 30
